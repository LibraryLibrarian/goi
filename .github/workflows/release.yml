name: release

# 毎日0:00（日本時間）に、前日までに develop へマージされた変更をリリースする。
#   1. 0:00 より前に develop へ入った最後の commit を、その日のリリースの対象にする
#   2. 検証・テスト・ビルドを行う
#   3. GitHub Releases に vYYYY.MM.DD（同じ日の2回目以降は .2, .3 …）を公開する
#   4. main をその commit まで進める（fast-forward のみ）
# その日に更新がなければ何もしない。定期実行は公開リポジトリでだけ動く。
# 手動実行は既定で dry run（main の更新とリリースをせず、成果物として保存するだけ）。

on:
  schedule:
    - cron: "0 15 * * *" # 0:00（日本時間）
  workflow_dispatch:
    inputs:
      dry_run:
        description: "確認だけを行い、mainの更新とリリースはしない"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.8"
  TZ: Asia/Tokyo

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # main の更新、タグとリリースの作成
      issues: write # 失敗の通知
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: リリースの対象を決める
        id: plan
        run: |
          set -euo pipefail
          skip() { echo "$1"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; }

          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" = "true" ]; then
              skip "非公開のリポジトリなので、定期実行のリリースは行わない"
            fi
            # 今日の0:00（日本時間）より前に develop へ入った最後の commit を、前日分としてリリースする
            cutoff="$(date -d 'today 00:00' --iso-8601=seconds)"
            day="$(date -d 'yesterday' +%F)"
            target="$(git rev-list -1 --first-parent --before="$cutoff" origin/develop)"
          else
            day="$(date +%F)"
            target="$(git rev-parse origin/develop)"
            # 定期実行の場合に選ばれる対象も表示する（dry run で定期実行の処理を確かめるため）
            s_cutoff="$(date -d 'today 00:00' --iso-8601=seconds)"
            s_day="$(date -d 'yesterday' +%F)"
            s_target="$(git rev-list -1 --first-parent --before="$s_cutoff" origin/develop)"
            echo "定期実行の場合: 締め $s_cutoff、日付 $s_day、対象 ${s_target:-なし}"
          fi
          [ -n "$target" ] || skip "対象の commit がない"

          main="$(git rev-parse origin/main)"
          if git merge-base --is-ancestor "$target" "$main"; then
            skip "前回のリリースから develop に更新がない"
          fi
          if ! git merge-base --is-ancestor "$main" "$target"; then
            echo "::error::main が develop の祖先ではないため、fast-forward できない"
            exit 1
          fi

          # 前回の実行が途中で止まり、リリースだけが済んでいる場合は、main を進めるだけにする
          existing="$(git tag --points-at "$target" --list 'v*' | head -n 1)"
          previous="$(git describe --tags --abbrev=0 --match 'v*' "$main" 2>/dev/null || true)"
          {
            echo "skip=false"
            echo "day=$day"
            echo "target=$target"
            echo "existing=$existing"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "対象: $target（$day 分）、既存のタグ: ${existing:-なし}、前回のリリース: ${previous:-なし}"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.existing == ''
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: 検証・テスト・ビルド
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.existing == ''
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          git checkout --quiet --detach "$TARGET"
          uv sync --locked
          uv run pytest
          uv run dictctl schema --check
          uv run dictctl fmt --check
          uv run dictctl validate
          uv run dictctl build --target gboard

      - name: 版とリリースノートを作る
        id: notes
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.existing == ''
        env:
          DAY: ${{ steps.plan.outputs.day }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: |
          set -euo pipefail
          tag="$(git tag --list 'v*' | uv run dictctl release-version --date "$DAY")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          old=()
          if [ -n "$PREVIOUS" ]; then
            git worktree add --quiet --detach "$RUNNER_TEMP/previous" "$PREVIOUS"
            old=(--old "$RUNNER_TEMP/previous")
          fi
          # リリースノート（長いと省略する）と、差分の全件（タブ区切り。リリースに添付する）
          changes="dist/gboard/goi-gboard-changes.tsv"
          if ! { uv run dictctl diff "${old[@]}" --new . > "$RUNNER_TEMP/notes.md" &&
                 uv run dictctl diff "${old[@]}" --new . --format tsv > "$changes"; }; then
            echo "前回のリリース（$PREVIOUS）との差分は作成できませんでした。" > "$RUNNER_TEMP/notes.md"
            rm -f "$changes"
          fi
          cp "$RUNNER_TEMP/notes.md" dist/gboard/RELEASE_NOTES.md
          echo "版: $tag"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: dry run の結果を保存する
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.existing == '' && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/gboard/
          if-no-files-found: error
          retention-days: 7

      - name: GitHub Releases に公開する
        if: steps.plan.outputs.skip == 'false' && steps.plan.outputs.existing == '' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          # 下書きで作り、ZIP と差分の全件を添付してから公開する
          assets=(dist/gboard/goi-gboard-*.zip)
          if [ -f dist/gboard/goi-gboard-changes.tsv ]; then
            assets+=(dist/gboard/goi-gboard-changes.tsv)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --target "$TARGET" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft
          gh release edit "$TAG" --draft=false

      - name: main を進める
        if: steps.plan.outputs.skip == 'false' && env.DRY_RUN != 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          # 認証情報はこのコマンドにだけ渡す（fast-forward のみ。force push はしない）
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$TARGET:refs/heads/main"

      - name: 失敗を Issue で知らせる
        if: failure() && github.event_name == 'schedule'
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "毎日のリリースに失敗しました（$(date +%F)）" \
            --body "実行ログ: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
