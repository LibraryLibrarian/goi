name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# 外部からの PR も同じワークフローで扱うため、権限は読み取りだけにし、シークレットは使わない
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.8"

jobs:
  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # requires-python の下限と、開発で使っている版
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  dictionary:
    name: lint and dictionary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: スキーマが最新か
        run: uv run dictctl schema --check
      - name: 辞書ファイルが整形済みか
        run: uv run dictctl fmt --check
      - name: 辞書の検証
        run: uv run dictctl validate
      - name: Gboard 向けのビルド
        run: uv run dictctl build --target gboard
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: goi-gboard
          path: dist/gboard/*.zip
          if-no-files-found: error
          retention-days: 14
